<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winter Watch | County Cavan</title>
</head>

<body>
  <h1>Winter Watch</h1>
  <p>Decision support for County Cavan's roads team.</p>

  <details open>
    <summary>AI Settings</summary>

    <label for="provider">AI Provider</label>
    <select id="provider">
      <option value="groq">Groq</option>
    </select>

    <label for="model">Model</label>
    <input id="model" value="openai/gpt-oss-20b">

    <label for="apiKey">API Key</label>
    <input
      type="password"
      id="apiKey"
      placeholder="Enter your API key"
    >

    <button id="saveBtn">Save</button>
    <button id="forgetBtn">Forget Key</button>
    <p id="settingsStatus" role="status" aria-live="polite">No settings saved yet.</p>
  </details>

  <h2>Ask Winter Watch</h2>

  <textarea id="question"
    placeholder="Ask a question about winter roads"></textarea>

  <button id="sendBtn">Send Question</button>

  <h3>AI Response</h3>
  <div id="response"></div>

  <script>
    const apiKeyInput = document.getElementById("apiKey");
    const modelInput = document.getElementById("model");
    const settingsStatus = document.getElementById("settingsStatus");

    // Restore this browser's saved settings. Never commit the key to GitHub.
    try {
      apiKeyInput.value = localStorage.getItem("groqApiKey") || "";
      modelInput.value = localStorage.getItem("groqModel") || "openai/gpt-oss-20b";
      if (apiKeyInput.value) settingsStatus.textContent = "Saved settings loaded from this browser.";
    } catch {
      settingsStatus.textContent = "Browser storage is unavailable.";
    }

    document.getElementById("saveBtn").addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      const model = modelInput.value.trim();
      if (!key || !model) {
        settingsStatus.textContent = "Enter both the API key and model before saving.";
        return;
      }
      try {
        localStorage.setItem("groqApiKey", key);
        localStorage.setItem("groqModel", model);
        settingsStatus.textContent = "Settings saved in this browser.";
      } catch {
        settingsStatus.textContent = "Could not save settings in this browser.";
      }
    });

    document.getElementById("forgetBtn").addEventListener("click", () => {
      try {
        localStorage.removeItem("groqApiKey");
        localStorage.removeItem("groqModel");
        apiKeyInput.value = "";
        modelInput.value = "openai/gpt-oss-20b";
        settingsStatus.textContent = "API key and model settings forgotten.";
      } catch {
        settingsStatus.textContent = "Could not clear browser storage. Clear this site's data manually.";
      }
    });
  </script>
</body>
</html>
